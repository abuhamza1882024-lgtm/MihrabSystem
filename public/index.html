<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>MIHRAB – Academy Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1e6d8;--card:#fffdf9;--tx:#2b2118;--mu:#7a6a58;--g:#0f5e52;--g2:#0b4a41;--au:#c9a227;--bd:#e2d3bf;--bad:#b3261e;--ok:#1b7a3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{background:#0f5e52;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{width:44px;height:44px;border-radius:8px}header b{font-size:18px;letter-spacing:1px}header .sp{flex:1}
header small{opacity:.85}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap}
main{max-width:1100px;margin:0 auto;padding:16px}
button,.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.sec{background:transparent;color:var(--g);border:1px solid var(--g)}button.bad{background:var(--bad)}button.ok{background:var(--ok)}
nav button{background:transparent;color:var(--tx);border:1px solid var(--bd)}nav button.on{background:var(--g);color:#fff;border-color:var(--g)}
button.sm{padding:3px 9px;font-size:13px}
nav button{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:15px}
.ic{width:26px;height:26px;stroke:#b4531f;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav button.on .ic{stroke:#ffd76a}
.sch{border:1px solid var(--bd);border-radius:12px;overflow:auto;max-height:74vh;background:var(--card);margin-bottom:14px}
.sg{display:grid;grid-template-columns:72px repeat(7,minmax(135px,1fr));min-width:1020px}
.dh{padding:10px 6px;text-align:center;border-bottom:1px solid var(--bd);border-inline-start:1px solid var(--bd);background:#faf5ec;position:sticky;top:0;z-index:3}
.dh b{display:block;color:#4a3c2c}.dh small{color:var(--mu)}.dh.td{border-bottom:3px solid var(--g)}.dh.td b{color:var(--g)}
.tc{position:sticky;inset-inline-start:0;background:#faf5ec;z-index:2}
.hl{padding:6px 10px;font-weight:600;font-size:13px;border-top:1px solid var(--bd);color:#4a3c2c}.hl:first-child{border-top:0}
.dc{position:relative;border-inline-start:1px solid var(--bd);background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(#f0e6d6 1px,transparent 1px);background-size:100% 96px,100% 48px}
.dc.ed{cursor:cell}
.cd{position:absolute;border-radius:6px;border-inline-start:4px solid;padding:3px 7px;font-size:12px;line-height:1.4;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px #0003;color:#2b2118}
.cd i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:5px}.cd .sb{color:#6b5b48;font-size:11px}
.ck{flex-direction:row!important;align-items:center;gap:5px!important;font-size:14px!important;color:var(--tx)!important}
.mu{color:var(--mu);font-size:12px}
.rc.cancel{background:#eee;border-color:#9a9a9a;opacity:.8;cursor:default}.ab{color:#b3261e;font-weight:700}
.at{font-size:16px;padding:10px 22px}.at.on{background:var(--g);color:#fff}.at.abs.on{background:#b3261e;border-color:#b3261e;color:#fff}
.cd.cn{opacity:.45;text-decoration:line-through}
.rc.pause{background:#fff8e1;border-color:#d1a823;opacity:.85;cursor:default}
@keyframes pop{0%{transform:scale(1) rotate(0)}30%{transform:scale(1.55) rotate(-14deg)}60%{transform:scale(.85) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
@keyframes lift{0%{transform:translateY(0)}40%{transform:translateY(-7px)}100%{transform:translateY(0)}}
nav button{transition:transform .15s,background .2s,box-shadow .2s}nav button:hover{transform:translateY(-2px);box-shadow:0 3px 8px #0002}nav button:active{transform:scale(.93)}
nav button .ic{transition:transform .2s}nav button:hover .ic{transform:scale(1.18) rotate(-6deg)}
nav button.bn{animation:lift .45s ease}nav button.bn .ic{animation:pop .65s ease}
@media(prefers-reduced-motion:reduce){nav button,nav button .ic{animation:none!important;transition:none!important}}
.av{border-radius:50%;object-fit:cover;background:#0f5e52;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}.av-row{display:flex;align-items:center;gap:12px}
.hero{border-radius:14px;padding:30px 24px;margin-bottom:16px;color:#fff;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center 38%;box-shadow:0 2px 8px #0003}
.hero h2{color:#fff;margin:0;font-size:28px}.hero p{margin:4px 0 0;opacity:.9}

.inv{background:#fff;color:#2b2118;padding:8px 6px;font-family:Georgia,'Times New Roman',serif}
.ih{display:flex;align-items:center;gap:12px;border-bottom:3px solid #0f5e52;padding-bottom:12px;margin-bottom:14px}.ih img{width:64px;height:64px;border-radius:10px}.ih .ir{margin-inline-start:auto;text-align:end}.ih h2{margin:0;color:#0f5e52;letter-spacing:3px}
.ib{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.pd{color:#1b7a3d}.up{color:#b3261e}
.it{margin-top:12px;text-align:end}.gt{font-size:22px;font-weight:700;color:#0f5e52;border-top:2px solid #c9a227;display:inline-block;margin-top:8px;padding-top:6px}
.pn{background:#faf5ec;border-inline-start:4px solid #c9a227;padding:8px 12px;margin-top:12px;font-size:13px}.ft{margin-top:18px;font-style:italic;text-align:center;color:#6b5b48}
@media print{.ov .card{border:0;box-shadow:none}}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:18px}
.rc{border-radius:12px;padding:16px;min-height:120px;border:1px solid;border-inline-start-width:6px;cursor:pointer;box-shadow:0 1px 3px #0002;font-size:15px}.rc b{font-size:17px;display:block}
.rc.todo{background:#e3f4e6;border-color:#2e9e5b}.rc.soon{background:#e6f0fd;border-color:#2f8cf0;cursor:default}
.rc.done{background-color:#fff5f1;border-color:#d9534f;background-image:repeating-linear-gradient(transparent 0 23px,#f3d9d2 23px 24px)}
.rs{margin-top:8px;color:#8a6d00;font-size:18px}.rs small{color:var(--mu);font-size:12px;margin-inline-start:8px}
.dt{margin:14px 0 8px}.chip{display:inline-block;padding:4px 12px;border:1px solid;border-radius:99px;font-size:13px;margin-inline-end:8px;margin-bottom:6px}
.sr{font-size:38px;cursor:pointer;color:#d1a823;margin-inline-end:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px;overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--au);border-radius:12px;padding:12px}
.stat span{color:var(--mu);font-size:13px}.stat b{display:block;font-size:22px}

function save(){
 if(!TOKEN)return;
 const request=++SEQ,headers=RESTORE?{'X-Restore':'1'}:{};
 RESTORE=false;
 api('/api/db',{method:'PUT',body:JSON.stringify(db),headers})
  .then(response=>response.json())

   if(data.error){

     if(!current.error){db=current;render()}

   }

  })
  .catch(()=>{})

function addS(){
 const name=$('#sn').value.trim(),phone=$('#sp').value;
 if(!name)return;
 if(phone.trim()&&!normPhone(phone))return alert('Invalid phone number. Include the country code, for example +1 555 123 4567.');
 db.students.push({
  id:db.n.s++,
  name,
  rate:me.role=='admin'?+$('#sr').value||0:0,
  phone:normPhone(phone),
  subs:[...document.querySelectorAll('.sbx:checked')].map(subject=>subject.value)
 });
 log('Added student '+name);
 render()
}

function pSchedOld(){const tch=me.role=='teacher',ed=db.slots.find(x=>x.id==F.edit)||{};
 const opt=(a,v,f)=>a.map(x=>`<option value="${f?x.id:x}" ${v==(f?x.id:x)?'selected':''}>${esc(f?x.name:x)}</option>`).join('');
 const form=tch?'':`<div class="card"><h3>${ed.id?'Edit':'New'} lesson slot</h3><div class="row"><label>Teacher<select id="f1">${opt(act(),ed.tid,1)}</select></label><label>Student<select id="f2">${opt(actS(),ed.sid,1)}</select></label><label>Day<select id="f3">${opt(DAYS,ed.day)}</select></label><label>Start (13:00–06:00)<input id="f4" type="time" value="${ed.start||'16:00'}"></label><label>Minutes<input id="f5" type="number" value="${ed.dur||60}" min="15" step="5" style="width:80px"></label><label>Subject<select id="f6">${opt(db.subjects,ed.sub)}</select></label><button onclick="saveSlot()">Save</button>${ed.id?'<button class="sec" onclick="F.edit=0;render()">Cancel</button>':''}</div><p style="font-size:12px;color:var(--mu)">Times after midnight (00:00–06:00) belong to the selected day’s evening session.</p></div>`;
 let sl=db.slots.filter(x=>(!tch||x.tid==me.tid)&&(!F.t||x.tid==F.t||tch)&&(!F.q||S(x.sid).name.toLowerCase().includes(F.q.toLowerCase())));
 const filt=tch?'':`<div class="row"><label>Teacher<select onchange="F.t=+this.value;render()"><option value="0">All</option>${act().map(t=>`<option value="${t.id}" ${F.t==t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label></div>`;
 const grid=DAYS.map(d=>{const r=sl.filter(x=>x.day==d).sort((a,b)=>toMin(a.start)-toMin(b.start));return`<div class="day"><b>${d}</b>${r.length?'':'<div style="color:var(--mu)">No lessons</div>'}${r.map(x=>`<div>${x.start}–${fmt(toMin(x.start)+x.dur)} · ${esc(S(x.sid).name)} · ${esc(x.sub)}${tch?'':' · '+esc(T(x.tid).name)+` <button class="sm sec" onclick="F.edit=${x.id};render();scrollTo(0,0)">Edit</button> <button class="sm bad" onclick="delSlot(${x.id})">×</button>`}</div>`).join('')}</div>`}).join('');
 return`<h2>${tch?'My weekly schedule':'Weekly schedule'}</h2>${form}<div class="card">${filt}${grid}</div>`}
function saveSlot(){const o={tid:+$('#f1').value,sid:+$('#f2').value,day:$('#f3').value,start:$('#f4').value,dur:+$('#f5').value,sub:$('#f6').value};
 if(!o.start||o.dur<5)return alert('Enter a valid time and duration');const s=toMin(o.start),e=s+o.dur;
 if(s<720||e>1800)return alert('Lessons must fall between 12:00 PM and 6:00 AM the next day.');
 const c=db.slots.find(x=>x.id!=F.edit&&x.day==o.day&&(x.tid==o.tid||x.sid==o.sid)&&toMin(x.start)<e&&s<toMin(x.start)+x.dur);
 if(c)return alert(c.tid==o.tid?'Conflict: this teacher already has a lesson at that time.':'Conflict: this student already has a lesson at that time.');
 if(F.edit){Object.assign(db.slots.find(x=>x.id==F.edit),o);F.edit=0}else db.slots.push({id:db.n.sl++,...o,since:ymd(cairoDate())});log('Schedule saved: '+T(o.tid).name+' / '+S(o.sid).name+' '+o.day+' '+o.start);render()}
function delSlot(id){ask('Delete this slot?',()=>{db.slots=db.slots.filter(x=>x.id!=id);log('Slot deleted');render()})}

function pReg(){const my=db.slots.filter(x=>x.tid==me.tid),t=T(me.tid);
 return`<h2>Lesson registration</h2>${summary()}<div class="card"><div class="row"><label>Student & lesson<select id="r1" onchange="const s=db.slots.find(x=>x.id==this.value);$('#r3').value=s?s.dur:60">${my.map(x=>`<option value="${x.id}">${esc(S(x.sid).name)} · ${esc(x.sub)} · ${x.day} ${x.start}</option>`).join('')}</select></label><label>Date<input id="r2" type="date" value="${ymd(cairoDate())}"></label><label>Duration (min)<input id="r3" type="number" value="${my[0]?.dur||60}" style="width:90px"></label><label>Homework<input id="r4" placeholder="Status / details"></label><label>Rating<select id="r5">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select></label><button onclick="regL()">Submit</button></div></div>`}
function regL(){const sl=db.slots.find(x=>x.id==$('#r1').value);if(!sl)return alert('No scheduled lessons assigned to you');const date=$('#r2').value,dur=+$('#r3').value;
 if(!date||dur<5)return alert('Enter date and duration');const[y,mo,dd]=date.split('-').map(Number);if(['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(y,mo-1,dd).getDay()]!=sl.day)return alert('The selected date does not match the lesson day.');const end=new Date(y,mo-1,dd,0,toMin(sl.start)+sl.dur);if(end>cairoDate())return alert('You can only register a lesson after it ends ('+end.toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'})+').');if(db.lessons.some(l=>l.slot==sl.id&&l.date==date&&l.status!='rejected'))return alert('This lesson is already registered for that date.');
 db.lessons.push({id:db.n.l++,tid:me.tid,sid:sl.sid,slot:sl.id,sub:sl.sub,date,dur,hw:$('#r4').value,rating:+$('#r5').value,status:'approved',tr:T(me.tid).rate,isNew:1});save();alert('Lesson registered and counted.');view='My Lessons';render()}
function summary(){const s=sum(approved({t:me.tid}));return`<div class="grid"><div class="stat"><span>Total teaching hours (approved)</span><b>${fh(s.min)}</b></div><div class="stat"><span>Total salary</span><b>${money(s.sal)}</b></div></div>`}

function pLess(){const tch=me.role=='teacher';
 let ls=db.lessons.filter(l=>(!tch||l.tid==me.tid)&&(!F.st||l.status==F.st)&&(!F.q||S(l.sid).name.toLowerCase().includes(F.q.toLowerCase())||T(l.tid).name.toLowerCase().includes(F.q.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date));

function setL(id,st){const l=db.lessons.find(x=>x.id==id);l.status=st;if(st=='approved'){l.tr=T(l.tid).rate;l.sr=S(l.sid).rate}log(`Lesson #${id} ${st}`);render()}

function pFin(){const m=F.m??ym,tl=db.teachers.filter(t=>(!t.left||approved({m,t:t.id}).length)&&(!F.ft||t.id==F.ft)),sl=db.students.filter(s=>(!s.left||approved({m,s:s.id}).length)&&(!F.fs||s.id==F.fs));
 const pay=(k)=>db.pay[k]?'paid':'unpaid';
 return`<h2>Financial management</h2><div class="card"><div class="row"><label>Month / year (clear = all)<input type="month" value="${m}" onchange="F.m=this.value;render()"></label><label>Teacher<select onchange="F.ft=+this.value;render()"><option value="0">All</option>${db.teachers.map(t=>`<option value="${t.id}" ${F.ft==t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><label>Student<select onchange="F.fs=+this.value;render()"><option value="0">All</option>${db.students.map(t=>`<option value="${t.id}" ${F.fs==t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label></div><p style="font-size:12px;color:var(--mu)">Only approved lessons count. Rates are frozen at approval, so past months never change.</p></div>
 <div class="card"><h3>Teacher salary report</h3><table><tr><th>Teacher</th><th>Lessons</th><th>Hours</th><th>Rate</th><th>Salary</th><th>Status</th><th></th></tr>${tl.map(t=>{const s=sum(approved({m,t:t.id})),k='t'+t.id+m;return`<tr><td>${esc(t.name)}</td><td>${s.n}</td><td>${fh(s.min)}</td><td>${t.rate}</td><td>${money(s.sal)}</td><td><span class="tag ${pay(k)}">${pay(k)}</span></td><td><button class="sm sec" onclick="togPay('${k}')">Mark ${pay(k)=='paid'?'unpaid':'paid'}</button> <button class="sm" onclick="stmt('t',${t.id},'${m}')">Statement</button></td></tr>`}).join('')}</table></div>

function stmt(kind,id,m){if(me.role=='hr'||(me.role=='teacher'&&!(kind=='t'&&id==me.tid&&db.shared['t'+id+m])))return;if(kind=='s')return invoiceView(id,m);const t=kind=='t',o=t?T(id):S(id),ls=approved({m,[t?'t':'s']:id}),s=sum(ls);

function trs(s){if(LANG!='ar'||typeof s!='string')return s;const t=s.trim();if(!t)return s;let m=t.match(/^([0-9]+) lesson[(]s[)] waiting for approval[.]$/);if(m)return s.replace(t,()=>m[1]+' حصة بانتظار الاعتماد.');m=t.match(/^You can only register a lesson after it ends [(](.*)[)][.]$/);if(m)return s.replace(t,()=>'لا يمكن تسجيل الحصة إلا بعد انتهاء موعدها ('+m[1]+').');const one=x=>{x=x.trim();if(AR[x])return AR[x];for(const[p,q]of PRE)if(x.startsWith(p))return q+one(x.slice(p.length));return x};let r=t.split(' · ').map(one).join(' · ');r=r.replace(/([0-9]+)h ([0-9]+)m/g,(a,b,c)=>b+'س '+c+'د').replace(/ EGP/g,' ج.م');for(const d of DAYS)r=r.split(d).join(AR[d]);return s.replace(t,()=>r)}
function trDom(){const de=document.documentElement;de.lang=LANG;de.dir=LANG=='ar'?'rtl':'ltr';if(LANG!='ar')return;const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(n=>{if(n.parentNode.tagName=='SCRIPT'||n.parentNode.closest('[data-notr]'))return;const v=trs(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v});document.querySelectorAll('[placeholder]').forEach(e=>e.placeholder=trs(e.placeholder))}

function lanes(list){list.sort((a,b)=>toMin(a.start)-toMin(b.start));const cl=[];let cur=[],end=0;list.forEach(x=>{const s=toMin(x.start);if(cur.length&&s>=end){cl.push(cur);cur=[];end=0}cur.push(x);end=Math.max(end,s+x.dur)});if(cur.length)cl.push(cur);const out=[];cl.forEach(c=>{const ln=[],L=new Map();c.forEach(x=>{const s=toMin(x.start);let i=ln.findIndex(e=>e<=s);if(i<0){i=ln.length;ln.push(0)}ln[i]=s+x.dur;L.set(x,i)});c.forEach(x=>out.push([x,L.get(x),ln.length]))});return out}
